<!doctype html><html><head><meta charset="utf-8"><title>good</title>
<style>
:root{--text:#1f2328;--muted:#57606a;--accent:#0969da;--border:#d0d7de}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;color:var(--text);line-height:1.5}
main{max-width:960px;margin:0 auto;padding:32px 16px}
h1{font-size:28px;font-weight:600;margin:0 0 8px}
p{margin:0 0 16px;color:var(--muted);font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.card{border:1px solid var(--border);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:12px}
.card p{flex:1;margin:0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff}
a{color:var(--accent)}
</style></head><body><main>
<h1>Plans</h1>
<p>Pick the plan that fits your team. <a href="#">Compare features</a></p>
<div class="cards">
<div class="card"><h2 style="font-size:20px;margin:0">Basic</h2><p>Short.</p><button>Choose Basic</button></div>
<div class="card"><h2 style="font-size:20px;margin:0">Pro</h2><p>A much longer description that wraps onto several lines but the button still lines up.</p><button>Choose Pro</button></div>
</div></main></body></html>
