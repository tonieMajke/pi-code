[package]
name = "pi-gui"
version = "0.0.4"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "pi_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "~2.5"  # 2.6 wymaga tauri 2.12; npm @tauri-apps/plugin-opener jest na 2.5 (tauri build sprawdza zgodność)

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"  # ta sama wersja co w wry — schowek z obrazem (clipboard_image)
